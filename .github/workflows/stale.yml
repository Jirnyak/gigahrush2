# НАДГРОБИЕ, а не воркфлоу. Файл существует ровно для того, чтобы ПЕРЕСТАЛ
# запускаться призрак.
#
# Что случилось: `stale.yml` жил на ветке `torus` (закрыта архивом 2026-09-13) и
# нёс `schedule: cron`. Ветку закрыли, файл на `main` не приехал — а GitHub
# продолжил заводить его по расписанию КАЖДУЮ НОЧЬ: воркфлоу числится в API со
# статусом `deleted`, прогоны идут, и с ~2026-09-28 каждый из них краснеет за
# три секунды об биллинг. То есть список прогонов ежедневно получал красную
# строку, не относящуюся ни к коду, ни к тестам — а красная строка, которая
# ничего не значит, обесценивает красные строки, которые значат.
#
# Выключить его через API нельзя: `disable` отвечает 403 «не активен». Поэтому
# единственный работающий приём — вернуть файл на default-ветку БЕЗ `schedule`,
# чтобы GitHub перерегистрировал воркфлоу с пустым расписанием.
#
# Тела у него нет намеренно: он ничего не делает и не должен. Удалять этот файл —
# значит вернуть призрака.
name: Automated Stale Issues & PRs

on:
  workflow_dispatch:

jobs:
  noop:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "надгробие — см. комментарий в начале файла"
