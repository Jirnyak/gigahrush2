# Dependabot. ОДНА экосистема, и это решение, а не недосмотр.
#
# ПОЧЕМУ УБРАН `npm` (2026-10-06): это остаток БРАУЗЕРНОГО проекта на TypeScript,
# который живёт в своём репозитории (`Jirnyak/gigahrush`) и с этим не пересекается
# «нигде и никак» (решение владельца). `package.json` здесь нет, и после гейта
# `source_rules` он прямо ЗАПРЕЩЁН — значит npm-половина могла только открывать
# ветки впустую. Ровно это она и делала.
#
# ЧТО ЗНАТЬ ПРО ОСТАВШУЮСЯ ПОЛОВИНУ. Dependabot открывает ОТДЕЛЬНУЮ ветку и PR на
# КАЖДУЮ зависимость — «много ветк» это его нормальная работа, а не поломка. Пять
# ветк, снесённых 2026-10-06, бампали экшены в `deploy-gh-pages.yml` — workflow,
# которого в main больше нет; он патчил мёртвое.
#
# И ГЛАВНАЯ ОГОВОРКА: CI в этом проекте МЁРТВ по решению владельца (биллинг
# GitHub Actions не взят, `problems.md` §83.7). Значит бамп версии экшена здесь
# НЕ ПРОВЕРЯЕМ ничем, а непроверяемый бамп хуже отсутствия бампа. Половина
# оставлена живой сознательно, но с интервалом МЕСЯЦ вместо недели и лимитом 3:
# она не чинит, она НАПОМИНАЕТ, а напоминать раз в неделю о том, что нельзя
# проверить, — это и есть шум.
#
# Когда CI оживёт (или виндовая машина станет регулярной) — вернуть недельный
# интервал, и тогда же свести версии: сегодня `actions/checkout` стоит и `@v4`, и
# `@v7` в разных workflow, потому что один бамп влили, а остальные нет.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
